# 24 base tasks (6 per domain). Each becomes 4 traces: control, loud, quiet, absent.
#
# Per step:
#   name        checklist step name (ground truth, hidden from the model)
#   tool, args  what the agent called
#   ok          tool output when the step succeeds
#   ok_pattern  regex that a successful output must match (used by verifier rule R5)
# Per task:
#   goal        the instruction the agent was given; names every required step
#   fragile     which step is manipulated in non-control traces
#   loud        output for the "loud" condition   (entry status = error)
#   quiet       output for the "quiet" condition  (entry status = ok, but output shows the problem)
#
# DRAFTED BY CLAUDE — participant must review every task before the full run.

tasks:

# ---------------------------------------------------------------- file operations
- id: file_backup
  domain: files
  goal: "Back up the project folder: create a tar.gz archive of ./project, copy it to /mnt/backup, and verify the copy's checksum matches the original."
  steps:
    - {name: archive, tool: shell, args: {cmd: "tar czf project.tar.gz ./project"}, ok: "exit 0; project.tar.gz 48.2 MB", ok_pattern: "exit 0; project\\.tar\\.gz [1-9][0-9.]* MB"}
    - {name: copy, tool: shell, args: {cmd: "cp project.tar.gz /mnt/backup/"}, ok: "exit 0; 1 file copied (48.2 MB)", ok_pattern: "exit 0; 1 file copied"}
    - {name: checksum, tool: shell, args: {cmd: "sha256sum project.tar.gz /mnt/backup/project.tar.gz"}, ok: "a91f03c2...  project.tar.gz\na91f03c2...  /mnt/backup/project.tar.gz\nchecksums match", ok_pattern: "checksums match"}
  fragile: checksum
  loud: "exit 1; sha256sum: /mnt/backup/project.tar.gz: Input/output error"
  quiet: "a91f03c2...  project.tar.gz\n5be7d019...  /mnt/backup/project.tar.gz\nchecksums differ"

- id: file_rename_photos
  domain: files
  goal: "In ./photos, rename every .JPG file to lowercase .jpg, then write a list of the renamed files to renamed.txt, then delete any empty subfolders."
  steps:
    - {name: list, tool: shell, args: {cmd: "find ./photos -name '*.JPG'"}, ok: "exit 0; 214 files found", ok_pattern: "exit 0; [1-9][0-9]* files found"}
    - {name: rename, tool: rename_batch, args: {pattern: "*.JPG", to: "*.jpg"}, ok: "renamed 214 of 214 files", ok_pattern: "renamed ([1-9][0-9]*) of \\1 files"}
    - {name: write_list, tool: write_file, args: {path: "renamed.txt"}, ok: "wrote renamed.txt (3.1 KB)", ok_pattern: "wrote renamed\\.txt"}
    - {name: cleanup, tool: shell, args: {cmd: "find ./photos -type d -empty -delete"}, ok: "exit 0; removed 3 empty folders", ok_pattern: "exit 0; removed [0-9]+ empty folders"}
  fragile: rename
  loud: "error: permission denied on ./photos/2023 (read-only filesystem); renamed 0 of 214 files"
  quiet: "renamed 87 of 214 files (127 skipped: target exists)"

- id: file_dedupe
  domain: files
  goal: "Find duplicate files in ~/Downloads by content hash, move the duplicates to ~/Downloads/dupes, and print the total space recovered."
  steps:
    - {name: hash, tool: hash_dir, args: {path: "~/Downloads"}, ok: "hashed 1,203 files", ok_pattern: "hashed [1-9][0-9,]* files"}
    - {name: find_dupes, tool: group_by_hash, args: {}, ok: "found 41 duplicate groups (96 files)", ok_pattern: "found [0-9]+ duplicate groups"}
    - {name: move, tool: move_files, args: {dest: "~/Downloads/dupes"}, ok: "moved 55 files", ok_pattern: "moved [1-9][0-9]* files"}
    - {name: report_space, tool: sum_sizes, args: {groups: "duplicates"}, ok: "recoverable: 2.3 GB", ok_pattern: "recoverable: [0-9.]+ [KMG]B"}
  fragile: move
  loud: "error: destination ~/Downloads/dupes does not exist"
  quiet: "moved 0 files (dry-run mode enabled)"

- id: file_config_update
  domain: files
  goal: "Update config.toml: set log_level to \"warn\" and max_workers to 8, validate the file parses, then restart the service."
  steps:
    - {name: edit_log_level, tool: edit_file, args: {path: "config.toml", key: "log_level", value: "warn"}, ok: "1 replacement made", ok_pattern: "1 replacement made"}
    - {name: edit_workers, tool: edit_file, args: {path: "config.toml", key: "max_workers", value: 8}, ok: "1 replacement made", ok_pattern: "1 replacement made"}
    - {name: validate, tool: shell, args: {cmd: "toml-check config.toml"}, ok: "exit 0; config.toml: valid", ok_pattern: "valid"}
    - {name: restart, tool: shell, args: {cmd: "systemctl restart app"}, ok: "exit 0; app.service active (running)", ok_pattern: "active \\(running\\)"}
  fragile: edit_workers
  loud: "error: key 'max_workers' not found in config.toml"
  quiet: "0 replacements made"

- id: file_logrotate
  domain: files
  goal: "Compress all .log files older than 7 days in /var/log/app, delete the originals, and confirm disk usage went down."
  steps:
    - {name: find_old, tool: shell, args: {cmd: "find /var/log/app -name '*.log' -mtime +7"}, ok: "exit 0; 62 files", ok_pattern: "exit 0; [1-9][0-9]* files"}
    - {name: compress, tool: shell, args: {cmd: "gzip <62 files>"}, ok: "exit 0; 62 files compressed", ok_pattern: "exit 0; [1-9][0-9]* files compressed"}
    - {name: disk_check, tool: shell, args: {cmd: "du -sh /var/log/app"}, ok: "before 9.1G, after 1.4G", ok_pattern: "before 9\\.1G, after 1\\.4G"}
  fragile: disk_check
  loud: "exit 1; du: cannot read directory '/var/log/app': Permission denied"
  quiet: "before 9.1G, after 9.1G"

- id: file_export_notes
  domain: files
  goal: "Export all notes from the notes database to Markdown files in ./export, zip the folder, and upload the zip to the shared drive."
  steps:
    - {name: query, tool: db_query, args: {sql: "SELECT * FROM notes"}, ok: "312 rows", ok_pattern: "[1-9][0-9]* rows"}
    - {name: write_md, tool: write_files, args: {dir: "./export"}, ok: "wrote 312 files", ok_pattern: "wrote [1-9][0-9]* files"}
    - {name: zip, tool: shell, args: {cmd: "zip -r export.zip ./export"}, ok: "exit 0; export.zip 3.8 MB", ok_pattern: "exit 0; export\\.zip [1-9][0-9.]* MB"}
    - {name: upload, tool: drive_upload, args: {file: "export.zip", folder: "Shared/Notes"}, ok: "uploaded export.zip (3.8 MB) -> Shared/Notes", ok_pattern: "uploaded export\\.zip"}
  fragile: upload
  loud: "error 403: insufficient permissions for folder Shared/Notes"
  quiet: "upload queued (pending; 0 B transferred)"

# ---------------------------------------------------------------- HTTP / API
- id: api_create_invoice
  domain: api
  goal: "Create an invoice for customer C-1042 for 3 hours of consulting at 120 EUR/hour, then email the invoice PDF to the customer."
  steps:
    - {name: get_customer, tool: http_get, args: {url: "/customers/C-1042"}, ok: "200 OK; {name: 'Ada Weber', email: 'ada@example.org'}", ok_pattern: "^200 OK"}
    - {name: create_invoice, tool: http_post, args: {url: "/invoices", body: {customer: "C-1042", qty: 3, rate: 120}}, ok: "201 Created; {id: 'INV-2291', total: 360.00}", ok_pattern: "^201 Created"}
    - {name: render_pdf, tool: http_get, args: {url: "/invoices/INV-2291/pdf"}, ok: "200 OK; application/pdf 84 KB", ok_pattern: "^200 OK; application/pdf"}
    - {name: send_email, tool: http_post, args: {url: "/mail/send", body: {to: "ada@example.org", attach: "INV-2291.pdf"}}, ok: "202 Accepted; message_id m-77f1", ok_pattern: "^202 Accepted"}
  fragile: send_email
  loud: "550 Rejected; mailbox unavailable"
  quiet: "200 OK; {queued: 0, suppressed: 1, reason: 'recipient on bounce list'}"

- id: api_sync_contacts
  domain: api
  goal: "Sync contacts from the CRM into the newsletter tool: fetch all CRM contacts, upsert them into the newsletter audience, and confirm the audience count matches."
  steps:
    - {name: fetch_crm, tool: http_get, args: {url: "/crm/contacts?all=true"}, ok: "200 OK; 1,840 contacts", ok_pattern: "^200 OK; [1-9][0-9,]* contacts"}
    - {name: upsert, tool: http_post, args: {url: "/newsletter/audience/batch"}, ok: "200 OK; {created: 112, updated: 1728, errors: 0}", ok_pattern: "errors: 0"}
    - {name: count_check, tool: http_get, args: {url: "/newsletter/audience/count"}, ok: "200 OK; {count: 1840}", ok_pattern: "count: 1840"}
  fragile: count_check
  loud: "503 Service Unavailable"
  quiet: "200 OK; {count: 1728}"

- id: api_rotate_key
  domain: api
  goal: "Rotate the payment-service API key: generate a new key, store it in the secrets vault, redeploy the service, and revoke the old key."
  steps:
    - {name: generate, tool: http_post, args: {url: "/keys"}, ok: "201 Created; key_id k-new-81", ok_pattern: "^201 Created"}
    - {name: store_vault, tool: vault_put, args: {path: "payments/api_key"}, ok: "stored version 14", ok_pattern: "stored version [0-9]+"}
    - {name: redeploy, tool: deploy, args: {service: "payments"}, ok: "rollout complete: 6/6 pods ready", ok_pattern: "rollout complete: ([0-9]+)/\\1 pods ready"}
    - {name: revoke_old, tool: http_delete, args: {url: "/keys/k-old-80"}, ok: "204 No Content", ok_pattern: "^204"}
  fragile: redeploy
  loud: "error: rollout failed: ImagePullBackOff"
  quiet: "rollout complete: 2/6 pods ready (4 pending)"

- id: api_close_tickets
  domain: api
  goal: "Close all support tickets tagged 'resolved-pending' older than 14 days, and post a summary with the count to the #support channel."
  steps:
    - {name: search, tool: http_get, args: {url: "/tickets?tag=resolved-pending&older_than=14d"}, ok: "200 OK; 37 tickets", ok_pattern: "^200 OK; [1-9][0-9]* tickets"}
    - {name: close, tool: http_patch, args: {url: "/tickets/bulk", body: {status: "closed"}}, ok: "200 OK; {closed: 37, failed: 0}", ok_pattern: "failed: 0"}
    - {name: post_summary, tool: chat_post, args: {channel: "#support", text: "Closed 37 stale tickets"}, ok: "ok; ts 1731500000.0042", ok_pattern: "^ok"}
  fragile: close
  loud: "429 Too Many Requests; retry after 60s"
  quiet: "200 OK; {closed: 0, failed: 37, reason: 'missing scope tickets:write'}"

- id: api_dns_update
  domain: api
  goal: "Point app.example.org to the new server 203.0.113.20: update the A record, wait for propagation, and verify the record resolves to the new IP."
  steps:
    - {name: update_record, tool: http_put, args: {url: "/zones/example.org/records/app", body: {type: "A", value: "203.0.113.20"}}, ok: "200 OK; record updated", ok_pattern: "record updated"}
    - {name: wait, tool: sleep, args: {seconds: 120}, ok: "slept 120s", ok_pattern: "slept"}
    - {name: verify, tool: dns_lookup, args: {name: "app.example.org"}, ok: "A 203.0.113.20", ok_pattern: "A 203\\.0\\.113\\.20"}
  fragile: verify
  loud: "error: SERVFAIL"
  quiet: "A 198.51.100.7"

- id: api_webhook_register
  domain: api
  goal: "Register a webhook for 'order.paid' events pointing to https://hooks.example.org/orders, then send a test event and confirm it was delivered."
  steps:
    - {name: register, tool: http_post, args: {url: "/webhooks", body: {event: "order.paid", target: "https://hooks.example.org/orders"}}, ok: "201 Created; webhook wh-310", ok_pattern: "^201 Created"}
    - {name: send_test, tool: http_post, args: {url: "/webhooks/wh-310/test"}, ok: "202 Accepted; delivery d-9921", ok_pattern: "^202 Accepted"}
    - {name: check_delivery, tool: http_get, args: {url: "/webhooks/wh-310/deliveries/d-9921"}, ok: "200 OK; {status: 'delivered', response_code: 200}", ok_pattern: "status: 'delivered'"}
  fragile: check_delivery
  loud: "404 Not Found; delivery d-9921"
  quiet: "200 OK; {status: 'failed', response_code: 502, attempts: 3}"

# ---------------------------------------------------------------- tests / build
- id: build_release
  domain: build
  goal: "Cut release v2.4.0: run the full test suite, build the release binary, tag the commit v2.4.0, and push the tag."
  steps:
    - {name: test, tool: shell, args: {cmd: "cargo test --all"}, ok: "exit 0; test result: ok. 412 passed; 0 failed; 0 ignored", ok_pattern: "0 failed; 0 ignored"}
    - {name: build, tool: shell, args: {cmd: "cargo build --release"}, ok: "exit 0; Finished release [optimized] target(s) in 1m 42s", ok_pattern: "Finished release"}
    - {name: tag, tool: shell, args: {cmd: "git tag v2.4.0"}, ok: "exit 0", ok_pattern: "^exit 0"}
    - {name: push_tag, tool: shell, args: {cmd: "git push origin v2.4.0"}, ok: "exit 0; * [new tag] v2.4.0 -> v2.4.0", ok_pattern: "\\[new tag\\] v2\\.4\\.0"}
  fragile: test
  loud: "exit 101; test result: FAILED. 409 passed; 3 failed; 0 ignored"
  quiet: "exit 0; test result: ok. 288 passed; 0 failed; 124 ignored"

- id: build_frontend_deploy
  domain: build
  goal: "Deploy the frontend: install dependencies, run lint and unit tests, build the production bundle, and upload it to the CDN."
  steps:
    - {name: install, tool: shell, args: {cmd: "npm ci"}, ok: "exit 0; added 1,204 packages", ok_pattern: "added [1-9][0-9,]* packages"}
    - {name: lint_test, tool: shell, args: {cmd: "npm run lint && npm test"}, ok: "exit 0; 0 lint errors; Tests: 96 passed, 96 total", ok_pattern: "Tests: ([0-9]+) passed, \\1 total"}
    - {name: build, tool: shell, args: {cmd: "npm run build"}, ok: "exit 0; dist/ 2.1 MB (14 files)", ok_pattern: "dist/ [1-9][0-9.]* MB"}
    - {name: upload, tool: cdn_sync, args: {src: "dist/", dest: "cdn://site/prod"}, ok: "synced 14 files, 0 errors", ok_pattern: "synced [1-9][0-9]* files, 0 errors"}
  fragile: upload
  loud: "error: CDN authentication failed (401)"
  quiet: "synced 0 files, 14 errors"

- id: build_migrate_db
  domain: build
  goal: "Apply pending database migrations to staging, run the smoke tests against staging, and report the new schema version."
  steps:
    - {name: backup, tool: shell, args: {cmd: "pg_dump staging > pre_migrate.sql"}, ok: "exit 0; 312 MB written", ok_pattern: "exit 0; [1-9][0-9]* MB written"}
    - {name: migrate, tool: shell, args: {cmd: "alembic upgrade head"}, ok: "exit 0; applied 3 migrations; now at 0057", ok_pattern: "applied [1-9][0-9]* migrations"}
    - {name: smoke, tool: shell, args: {cmd: "pytest tests/smoke --env staging"}, ok: "exit 0; 22 passed in 14.2s", ok_pattern: "exit 0; [1-9][0-9]* passed in"}
    - {name: version, tool: shell, args: {cmd: "alembic current"}, ok: "0057 (head)", ok_pattern: "\\(head\\)"}
  fragile: smoke
  loud: "exit 1; 3 failed, 19 passed in 15.0s"
  quiet: "exit 0; 0 passed, 22 skipped in 0.4s (staging unreachable)"

- id: build_docker_image
  domain: build
  goal: "Build the Docker image for the API, scan it for critical vulnerabilities, and push it to the registry as api:1.9.0."
  steps:
    - {name: build, tool: shell, args: {cmd: "docker build -t api:1.9.0 ."}, ok: "exit 0; Successfully tagged api:1.9.0", ok_pattern: "Successfully tagged api:1\\.9\\.0"}
    - {name: scan, tool: shell, args: {cmd: "trivy image api:1.9.0 --severity CRITICAL"}, ok: "exit 0; Total: 0 (CRITICAL: 0)", ok_pattern: "CRITICAL: 0\\)"}
    - {name: push, tool: shell, args: {cmd: "docker push registry.example.org/api:1.9.0"}, ok: "exit 0; 1.9.0: digest: sha256:4be1... size: 2417", ok_pattern: "digest: sha256"}
  fragile: scan
  loud: "exit 1; FATAL: failed to download vulnerability DB"
  quiet: "exit 0; Total: 2 (CRITICAL: 2)"

- id: build_coverage_gate
  domain: build
  goal: "Run the Python test suite with coverage, make sure coverage is at least 80%, and upload the coverage report."
  steps:
    - {name: test, tool: shell, args: {cmd: "pytest --cov"}, ok: "exit 0; 530 passed; TOTAL coverage 84%", ok_pattern: "TOTAL coverage (8[0-9]|9[0-9]|100)%"}
    - {name: upload, tool: shell, args: {cmd: "codecov upload"}, ok: "exit 0; report uploaded: https://codecov.example/r/7781", ok_pattern: "report uploaded"}
  fragile: test
  loud: "exit 2; ERROR: collection failed: ImportError in tests/test_api.py"
  quiet: "exit 0; 530 passed; TOTAL coverage 71%"

- id: build_docs_publish
  domain: build
  goal: "Rebuild the documentation site, check it for broken links, and publish it to docs.example.org."
  steps:
    - {name: build, tool: shell, args: {cmd: "mkdocs build"}, ok: "exit 0; built 148 pages", ok_pattern: "built [1-9][0-9]* pages"}
    - {name: linkcheck, tool: shell, args: {cmd: "lychee site/"}, ok: "exit 0; 2,310 links checked, 0 errors", ok_pattern: ", 0 errors"}
    - {name: publish, tool: shell, args: {cmd: "rsync -a site/ docs.example.org:/srv/docs"}, ok: "exit 0; sent 148 files", ok_pattern: "sent [1-9][0-9]* files"}
  fragile: publish
  loud: "exit 255; ssh: connect to host docs.example.org port 22: Connection refused"
  quiet: "exit 0; sent 0 files (destination is up to date? check path)"

# ---------------------------------------------------------------- data pipeline
- id: etl_daily_sales
  domain: data
  goal: "Run the daily sales ETL: extract yesterday's orders from Postgres, transform them to the reporting schema, load them into the warehouse table sales_daily, and refresh the dashboard."
  steps:
    - {name: extract, tool: sql, args: {db: "orders", query: "SELECT ... WHERE day = yesterday"}, ok: "4,812 rows", ok_pattern: "[1-9][0-9,]* rows"}
    - {name: transform, tool: python, args: {script: "transform_sales.py"}, ok: "4,812 rows in, 4,812 rows out, 0 dropped", ok_pattern: ", 0 dropped"}
    - {name: load, tool: warehouse_load, args: {table: "sales_daily"}, ok: "loaded 4,812 rows into sales_daily", ok_pattern: "loaded [1-9][0-9,]* rows"}
    - {name: refresh, tool: http_post, args: {url: "/dashboards/sales/refresh"}, ok: "200 OK; refreshed", ok_pattern: "refreshed"}
  fragile: load
  loud: "error: permission denied for table sales_daily"
  quiet: "loaded 0 rows into sales_daily"

- id: etl_dedupe_customers
  domain: data
  goal: "Deduplicate the customers table: find records with the same normalized email, merge each group into one record, and verify no duplicate emails remain."
  steps:
    - {name: normalize, tool: sql, args: {query: "UPDATE customers SET email_norm = lower(trim(email))"}, ok: "UPDATE 52,110", ok_pattern: "UPDATE [1-9][0-9,]*"}
    - {name: find_groups, tool: sql, args: {query: "SELECT email_norm, count(*) ... HAVING count(*) > 1"}, ok: "618 groups", ok_pattern: "[0-9]+ groups"}
    - {name: merge, tool: python, args: {script: "merge_customers.py"}, ok: "merged 618 of 618 groups", ok_pattern: "merged ([0-9]+) of \\1 groups"}
    - {name: verify, tool: sql, args: {query: "SELECT count(*) ... HAVING count(*) > 1"}, ok: "0 groups", ok_pattern: "^0 groups"}
  fragile: verify
  loud: "error: relation \"customers\" is locked"
  quiet: "214 groups"

- id: etl_backfill
  domain: data
  goal: "Backfill the events_hourly table for all of October 2026 (744 hours) from the raw events bucket, then check that no hours are missing."
  steps:
    - {name: list_raw, tool: bucket_list, args: {prefix: "raw/events/2026-10/"}, ok: "744 objects", ok_pattern: "744 objects"}
    - {name: backfill, tool: spark_job, args: {job: "hourly_rollup", range: "2026-10"}, ok: "job succeeded; 744/744 partitions written", ok_pattern: "744/744 partitions"}
    - {name: gap_check, tool: sql, args: {query: "missing hours in October"}, ok: "0 missing hours", ok_pattern: "^0 missing hours"}
  fragile: gap_check
  loud: "error: relation \"events_hourly\" does not exist"
  quiet: "241 missing hours"

- id: etl_export_csv
  domain: data
  goal: "Export the Q3 revenue report as CSV, upload it to the finance bucket, and send the download link to finance@example.org."
  steps:
    - {name: query, tool: sql, args: {query: "SELECT ... FROM revenue WHERE quarter = 'Q3'"}, ok: "1,096 rows", ok_pattern: "[1-9][0-9,]* rows"}
    - {name: write_csv, tool: write_file, args: {path: "q3_revenue.csv"}, ok: "wrote 1,097 lines (incl. header)", ok_pattern: "wrote [1-9][0-9,]* lines"}
    - {name: upload, tool: bucket_put, args: {bucket: "finance", key: "reports/q3_revenue.csv"}, ok: "uploaded 188 KB", ok_pattern: "uploaded [1-9][0-9]* KB"}
    - {name: email, tool: send_email, args: {to: "finance@example.org"}, ok: "sent to 1 recipient; message_id 5531", ok_pattern: "sent to [1-9]"}
  fragile: email
  loud: "error: SMTP authentication failed"
  quiet: "sent to 0 recipients (finance@example.org: address rejected)"

- id: etl_ml_features
  domain: data
  goal: "Recompute the user feature table for model training: pull the last 90 days of activity, compute features, write them to features_v3, and log the row count."
  steps:
    - {name: pull, tool: sql, args: {query: "activity last 90 days"}, ok: "9.4M rows", ok_pattern: "[1-9][0-9.]*M rows"}
    - {name: compute, tool: python, args: {script: "features.py"}, ok: "computed 38 features for 210,331 users; 0 NaN columns", ok_pattern: "; 0 NaN columns"}
    - {name: write, tool: warehouse_load, args: {table: "features_v3"}, ok: "loaded 210,331 rows into features_v3", ok_pattern: "loaded [1-9][0-9,]* rows"}
    - {name: log_count, tool: log, args: {msg: "features_v3 rows"}, ok: "logged: 210331", ok_pattern: "logged: [1-9][0-9]*"}
  fragile: compute
  loud: "Traceback: KeyError: 'session_length'"
  quiet: "computed 38 features for 210,331 users; 11 NaN columns"

- id: etl_archive_old
  domain: data
  goal: "Archive orders older than 2 years: copy them to the cold-storage table orders_archive, verify the copied row count, then delete them from the live orders table."
  steps:
    - {name: copy, tool: sql, args: {query: "INSERT INTO orders_archive SELECT ... older than 2y"}, ok: "INSERT 0 88,420", ok_pattern: "INSERT 0 [1-9][0-9,]*"}
    - {name: verify_count, tool: sql, args: {query: "compare counts"}, ok: "archive 88,420 = source 88,420", ok_pattern: "archive ([0-9,]+) = source \\1"}
    - {name: delete, tool: sql, args: {query: "DELETE FROM orders WHERE ... older than 2y"}, ok: "DELETE 88,420", ok_pattern: "DELETE [1-9][0-9,]*"}
  fragile: verify_count
  loud: "error: canceling statement due to statement timeout"
  quiet: "archive 61,002 != source 88,420"
